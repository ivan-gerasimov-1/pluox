# Run trusted repository pushes and manual jobs on our ARM64 runner.
# Pull requests are intentionally excluded from this shared VPS.
when:
  - event: push
  - event: manual
    evaluate: 'PLUOX_PREVIEW_RECONCILE != "true" || CI_COMMIT_BRANCH == "main"'
  - event: deployment
    branch: main
    evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "production" && (CI_PIPELINE_DEPLOY_TASK == "deploy" || CI_PIPELINE_DEPLOY_TASK == "rollback")'

steps:
  - name: install
    when: &buildChecks
      - event: push
      - event: manual
        evaluate: 'PLUOX_PREVIEW_RECONCILE != "true"'
      - event: deployment
        evaluate: 'CI_PIPELINE_DEPLOY_TASK == "deploy"'
    image: node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    environment:
      CI: 'true'
    commands:
      - node --version
      - npm --version
      - npm ci --no-audit --no-fund

  - name: unitTests
    when: *buildChecks
    image: node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    environment:
      CI: 'true'
    commands:
      - npm --workspace=@pluox/web run test -- --maxWorkers=1

  - name: buildWeb
    when: *buildChecks
    image: node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
    environment:
      CI: 'true'
      APP_API_URL: /api
      APP_PREVIEW: 'false'
      APP_UMAMI_SCRIPT_URL: ''
      APP_UMAMI_WEBSITE_ID: ''
      APP_SENTRY_DSN: ''
    commands:
      - npm --workspace=@pluox/web run build
      - test -s apps/web/build/index.html
      - test -s apps/web/build/sw.js

  - name: previewDeployment
    image: docker:29.9.2-cli
    when:
      - event: manual
        branch: main
        evaluate: 'PLUOX_PREVIEW_RECONCILE == "true"'
    environment:
      PREVIEW_PIPELINE_URL: ${CI_PIPELINE_URL}
      PLUOX_PREVIEW_ACTION: ${PLUOX_PREVIEW_ACTION}
      PLUOX_PREVIEW_PR: ${PLUOX_PREVIEW_PR}
      PLUOX_PREVIEW_SHA: ${PLUOX_PREVIEW_SHA}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/vps-infra:/opt/vps-infra:ro
      - /etc/pluoxPreviews.env:/etc/pluoxPreviews.env:ro
      - /etc/caddy:/etc/caddy:ro
      - /run/lock/pluox-deploy.lock:/run/lock/pluox-deploy.lock
    commands:
      - apk add --no-cache util-linux
      - flock --exclusive --no-fork /run/lock/pluox-deploy.lock sh /opt/vps-infra/current/apps/pluox/deploy/run.sh preview

  - name: deployFrontend
    image: docker:29.9.2-cli
    environment:
      PLUOX_API_ORIGIN:
        from_secret: pluox_api_origin
    when:
      - event: push
        branch: main
      - event: deployment
        branch: main
        evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "production" && (CI_PIPELINE_DEPLOY_TASK == "deploy" || CI_PIPELINE_DEPLOY_TASK == "rollback")'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/pluox-buildx:/root/.docker/buildx
      - /opt/vps-infra:/opt/vps-infra:ro
      - /opt/pluox:/opt/pluox
      - /run/lock/pluox-deploy.lock:/run/lock/pluox-deploy.lock
    commands:
      - apk add --no-cache 'nodejs~24' util-linux git
      - flock --exclusive --no-fork /run/lock/pluox-deploy.lock sh /opt/vps-infra/current/apps/pluox/deploy/run.sh production
