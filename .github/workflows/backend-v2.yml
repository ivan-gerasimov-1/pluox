# TODO: Implement .env file builder
# TODO: Find a way to parametrize "runs-on"
# TODO: bcrypt doesn’t work on a deployment if built on GitHub Actions.
# Due to that, we have to keep package.json/package-lock.json files,
# remove bcrypt from node_modules and manually reinstall the package.
name: Backend CI/CD V2

env:
  NODE_VERSION: 20.11.1

  NPM_BUILD_CMD: --workspace=@savee/backend run build

  ARTIFACTS_DIR: artifacts
  ARTIFACT_NAME: build

  DEPLOY_ORIGIN: artifacts/*
  DEPLOY_DESTINATION: ~/srv/savee/api

  IMAGE_TAG: ivan-gerasimov-1/savee:latest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/backend/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          npm ci
          npm $NPM_BUILD_CMD

      - name: Create artifacts directory
        run: |
          mkdir -p $ARTIFACTS_DIR

      - name: Copy files
        run: |
          cp -r \
            packages/backend/build/* \
            package-lock.json \
            packages/backend/package.json \
            packages/backend/ecosystem.config.js \
            packages/backend/Dockerfile \
            $ARTIFACTS_DIR/

      - name: Install production dependencies
        if: false
        run: |
          cd $ARTIFACTS_DIR
          npm install --include=prod

      - name: Clean up build
        # We have to keep the files due to bcrypt package issues
        if: false
        run: |
          rm \
            $ARTIFACTS_DIR/package.json \
            $ARTIFACTS_DIR/package-lock.json

      - name: Create Docker image
        run: |
          cd $ARTIFACTS_DIR
          docker buildx build \
            --platform linux/arm64 \
            --tag "${IMAGE_TAG}" \
            --push .
          docker save \
            --output image.tar "${IMAGE_TAG}"

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.ARTIFACTS_DIR }}/image.tar
          retention-days: 1

      # - name: Upload build artifact
      #   uses: actions/upload-artifact@v4
      #   if: false
      #   with:
      #     name: ${{ env.ARTIFACT_NAME }}
      #     path: ${{ env.ARTIFACTS_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_KEY: 'op://Savee/GitHub Actions/private key'
          HOST: 'op://Savee/Main Server/Host'
          USER: 'op://Savee/Main Server/Username'

      # - name: Download build artifact
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: ${{ env.ARTIFACT_NAME }}
      #     path: ${{ env.ARTIFACTS_DIR }}

      # Load and un-archive the Docker image
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Setup SSH
        run: |
          set -eu

          mkdir $HOME/.ssh

          echo "$SSH_KEY" \
            > $HOME/.ssh/ssh-rsa
          chmod 600 $HOME/.ssh/ssh-rsa

          ssh-keyscan -t rsa $HOST \
            > $HOME/.ssh/known_hosts
          chmod 600 $HOME/.ssh/known_hosts

          echo -e "
            Host $HOST
              \tHostName $HOST
              \tUser $USER
              \tIdentityFile $HOME/.ssh/ssh-rsa
            " \
            > $HOME/.ssh/config
          chmod 600 $HOME/.ssh/config

      - name: Prepare deployment destination directory
        run: |
          ssh -T $USER@$HOST "
            mkdir -p \
              $DEPLOY_DESTINATION
          "

      # - name: Deploy
      #   run: |
      #     rsync \
      #       --archive \
      #       --compress \
      #       --delete \
      #       $DEPLOY_ORIGIN $USER@$HOST:$DEPLOY_DESTINATION

      - name: Deploy
        run: |
          rsync \
            --archive \
            --compress \
            --delete \
            image.tar $USER@$HOST:$DEPLOY_DESTINATION

      - name: Run
        # Remove bcrypt related lines once the issue is resolved
        run: |
          ssh -T $USER@$HOST "
            docker load --input ~/srv/savee/api/image.tar
            docker run -d --name savee-api-new -p 3002:3001 -v ~/srv/savee/api/.env:/usr/src/app/.env  ivan-gerasimov-1/savee:latest
            docker stop savee-api
            docker rename savee-api savee-api-old
            docker rename savee-api-new savee-api
            docker update --publish-add 3001:3001 savee-api
            docker container rm savee-api-old
          "
