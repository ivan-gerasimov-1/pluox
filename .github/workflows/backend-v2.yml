# TODO: Implement .env file builder
# TODO: Find a way to parametrize "runs-on"
name: Backend CI/CD V2

env:
  NODE_VERSION: 20.11.1

  NPM_BUILD_CMD: --workspace=@savee/backend run build

  ARTIFACTS_DIR: artifacts
  ARTIFACT_NAME: build

  DEPLOY_ORIGIN: artifacts/*
  DEPLOY_DESTINATION: ~/srv/savee/api

  # Docker
  IMAGE_TAG: savee:latest
  IMAGE_NAME: savee_docker-image.tar
  CONTAINER_NAME: savee-api

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/backend/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          npm ci
          npm $NPM_BUILD_CMD

      - name: Create artifacts directory
        run: |
          mkdir -p $ARTIFACTS_DIR

      - name: Copy files
        run: |
          cp -r \
            packages/backend/build/* \
            package-lock.json \
            packages/backend/package.json \
            packages/backend/ecosystem.config.js \
            packages/backend/Dockerfile \
            $ARTIFACTS_DIR/

      - name: Build Docker image
        run: |
          cd $ARTIFACTS_DIR
          docker buildx build \
            --platform linux/arm64 \
            --tag "$IMAGE_TAG" \
            --load \
            .
          docker save \
            --output $ARTIFACTS_DIR/$IMAGE_NAME "$IMAGE_TAG"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_KEY: 'op://Savee/GitHub Actions/private key'
          HOST: 'op://Savee/Main Server/Host'
          USER: 'op://Savee/Main Server/Username'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Setup SSH
        run: |
          set -eu

          mkdir $HOME/.ssh

          echo "$SSH_KEY" \
            > $HOME/.ssh/ssh-rsa
          chmod 600 $HOME/.ssh/ssh-rsa

          ssh-keyscan -t rsa $HOST \
            > $HOME/.ssh/known_hosts
          chmod 600 $HOME/.ssh/known_hosts

          echo -e "
            Host $HOST
              \tHostName $HOST
              \tUser $USER
              \tIdentityFile $HOME/.ssh/ssh-rsa
            " \
            > $HOME/.ssh/config
          chmod 600 $HOME/.ssh/config

      - name: Prepare deployment destination directory
        run: |
          ssh -T $USER@$HOST "
            mkdir -p \
              $DEPLOY_DESTINATION
          "

      - name: Deploy
        run: |
          rsync \
            --archive \
            --compress \
            --delete \
            $DEPLOY_ORIGIN $USER@$HOST:$DEPLOY_DESTINATION

      - name: Run
        run: |
          ssh -T $USER@$HOST "
            docker load \
              --input ${DEPLOY_DESTINATION}/${IMAGE_NAME}
            docker stop ${CONTAINER_NAME}
            docker rm ${CONTAINER_NAME}
            docker run \
              --detach \
              --name ${CONTAINER_NAME} \
              --network dockernetworks_containers-network \
              -p 3001:3001 \
              -v ${DEPLOY_DESTINATION}/.env:/usr/src/app/.env \
              "$IMAGE_TAG"
          "
