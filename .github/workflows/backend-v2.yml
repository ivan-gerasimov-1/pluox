# TODO: Find a way to parametrize "runs-on"
name: Backend CI/CD V2

env:
  NODE_VERSION: 22.9.0

  NPM_BUILD_CMD: --workspace=@savee/backend-lite run build

  ARTIFACTS_DIR: apps/backend-lite/dist
  ARTIFACT_NAME: build

  DEPLOY_ORIGIN: artifacts/*
  DEPLOY_DESTINATION: ~/srv/savee/api

  # Docker
  IMAGE_TAG: ghcr.io/${{ github.repository }}/savee-api:stable
  IMAGE_NAME: savee_docker-image.tar
  CONTAINER_NAME: savee-api

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'apps/backend/**'
  # pull_request:
  #   branches:
  #     - main
  #   paths:
  #     - 'apps/backend/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ENV_FILE: 'op://Savee/savee-api_backend-lite_env/.env'

      - name: Log
        run: echo $ENV_FILE

      - name: Build
        run: |
          echo $PATH
          printf "%s" $ENV_FILE > apps/backend-lite/.env
          npm ci
          npm $NPM_BUILD_CMD

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # - name: Create artifacts directory
      #   run: |
      #     mkdir -p $ARTIFACTS_DIR

      # - name: Copy files
      #   run: |
      #     cp -r \
      #       apps/backend/build/* \
      #       package-lock.json \
      #       apps/backend/package.json \
      #       apps/backend/ecosystem.config.js \
      #       apps/backend/Dockerfile \
      #       apps/backend/docker-compose.yml \
      #       $ARTIFACTS_DIR/

      - name: Build Docker image
        run: |
          cd apps/backend-lite
          npm run _docker:copyFiles
          cd dist
          docker buildx build \
            --platform linux/arm64 \
            --tag ghcr.io/${{ github.repository }}/savee-api:stable \
            --load \
            .
          docker push ghcr.io/${{ github.repository }}/savee-api:stable

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_KEY: 'op://Savee/GitHub Actions/private key'
          HOST: 'op://Savee/Main Server/Host'
          USER: 'op://Savee/Main Server/Username'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Setup SSH
        run: |
          set -eu

          mkdir $HOME/.ssh

          echo "$SSH_KEY" \
            > $HOME/.ssh/ssh-rsa
          chmod 600 $HOME/.ssh/ssh-rsa

          ssh-keyscan -t rsa $HOST \
            > $HOME/.ssh/known_hosts
          chmod 600 $HOME/.ssh/known_hosts

          echo -e "
            Host $HOST
              \tHostName $HOST
              \tUser $USER
              \tIdentityFile $HOME/.ssh/ssh-rsa
            " \
            > $HOME/.ssh/config
          chmod 600 $HOME/.ssh/config

      - name: Prepare deployment destination directory
        run: |
          ssh -T $USER@$HOST "
            mkdir -p \
              $DEPLOY_DESTINATION
          "

      - name: Deploy
        run: |
          rsync \
            --archive \
            --compress \
            --delete \
            apps/backend-lite/.docker/docker-compose.yml apps/backend-lite/.env $USER@$HOST:$DEPLOY_DESTINATION

      - name: Run
        env:
          DOCKER_USERNAME: ${{ github.actor }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          SOMETHING: ${{ github.repository}}
        run: |
          ssh -T $USER@$HOST "
            echo ${DOCKER_PASSWORD} | docker login ghcr.io -u "${DOCKER_USERNAME}" --password-stdin
            docker pull ghcr.io/${SOMETHING}/savee-api:stable
            cd ${DEPLOY_DESTINATION}
            docker compose up -d
          "
