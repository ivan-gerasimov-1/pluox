name: Frontend CI/CD

env:
  NODE_VERSION: 16.20.2

  # NPM_BUILD_CMD: run build

  ARTIFACTS_DIR: build
  ARTIFACT_NAME: build

  # DEPLOY_ORIGIN: build/*
  # DEPLOY_DESTINATION: ~/srv/savee.gerasimov.dev

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'public/**'
  #     - 'src/**'
  #     - '*.*'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies and build the project
        run: |
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}

  deploy:
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          # SSH_KEY: 'op://Savee/GitHub Actions/private key'
          # HOST: 'op://Savee/Main Server/Host'
          # USER: 'op://Savee/Main Server/Username'
          CLOUDFLARE_ACCOUNT_ID: 'op://Savee/Cloudflare Wrangler/Account ID'
          CLOUDFLARE_API_TOKEN: 'op://Savee/Cloudflare Wrangler/API Token'

      - name: Setup SSH
        if: false
        run: |
          set -eu

          mkdir $HOME/.ssh

          echo "$SSH_KEY" \
            > $HOME/.ssh/ssh-rsa
          chmod 600 $HOME/.ssh/ssh-rsa

          ssh-keyscan -t rsa $HOST \
            > $HOME/.ssh/known_hosts
          chmod 600 $HOME/.ssh/known_hosts

          echo -e "
            Host $HOST
              \tHostName $HOST
              \tUser $USER
              \tIdentityFile $HOME/.ssh/ssh-rsa
            " \
            > $HOME/.ssh/config
          chmod 600 $HOME/.ssh/config

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Deploy
        if: false
        run: |
          rsync \
            --archive \
            --compress \
            --delete \
            $DEPLOY_ORIGIN $USER@$HOST:$DEPLOY_DESTINATION

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/frontend'
          command: pages deploy
