name: Backend (Cloudflare)

env:
  NODE_VERSION: 22.9.0

  NPM_LINT_CMD: --workspace=@savee/backend-lite run lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/backend-lite/**'
      - '.github/workflows/backend_cloudflare.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/backend-lite/**'
      - '.github/workflows/backend_cloudflare.yml'

jobs:
  lint:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint
        run: |
          npm $NPM_LINT_CMD
  deploy:
    runs-on: ubuntu-22.04
    needs: lint
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 'op://Savee/Cloudflare Wrangler/Account ID'
          CLOUDFLARE_API_TOKEN: 'op://Savee/Cloudflare Wrangler/API Token'
          ENV_FILE: 'op://Savee/savee-api-v3_cloudflare_env/.dev.vars.production'
          JWT_TOKEN_SECRET: 'op://Savee/savee-api-v3_cloudflare_env/JWT_TOKEN_SECRET.production'
          AUTH_COOKIE_SECRET: 'op://Savee/savee-api-v3_cloudflare_env/AUTH_COOKIE_SECRET.production'

      - name: Install dependencies
        run: |
          npm ci

      - name: Create .dev.vars file
        run: |
          echo -e "$ENV_FILE" > apps/backend-lite/.dev.vars

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '3.106.0'
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/backend-lite'
          secrets: |
            JWT_TOKEN_SECRET
            AUTH_COOKIE_SECRET
          command: deploy
        env:
          JWT_TOKEN_SECRET: ${{ env.JWT_TOKEN_SECRET }}
          AUTH_COOKIE_SECRET: ${{ env.AUTH_COOKIE_SECRET }}
