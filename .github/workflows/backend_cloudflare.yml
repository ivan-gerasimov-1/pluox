name: Backend (Cloudflare)

permissions:
  contents: read
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  NODE_VERSION_FILE: .nvmrc

  NPM_LINT_CMD: --workspace=@pluox/backend run lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend_cloudflare.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend_cloudflare.yml'

jobs:
  lint:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint
        run: |
          npm $NPM_LINT_CMD

  deploy:
    runs-on: ubuntu-24.04-arm
    needs: lint
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@dafbe7cb03502b260e2b2893c753c352eee545bf # v3
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 'op://LV48/Cloudflare Wrangler/Account ID'
          CLOUDFLARE_API_TOKEN: 'op://LV48/Cloudflare Wrangler/API Token'
          ENV_FILE: 'op://Pluox/pluox-api_cloudflare_env/.dev.vars.production'
          APP_OPEN_EXCHANGE_RATES_API_KEY: 'op://Pluox/pluox-api_cloudflare_env/APP_OPEN_EXCHANGE_RATES_API_KEY.production'

      - name: Install dependencies
        run: |
          npm ci

      - name: Create .dev.vars file
        run: |
          echo -e "$ENV_FILE" > apps/backend/.dev.vars

      - name: Deploy
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3
        with:
          wranglerVersion: '4.73.0'
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/backend'
          secrets: |
            APP_OPEN_EXCHANGE_RATES_API_KEY
          command: deploy
        env:
          APP_OPEN_EXCHANGE_RATES_API_KEY: ${{ env.APP_OPEN_EXCHANGE_RATES_API_KEY }}
