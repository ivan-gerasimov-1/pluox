name: Backend CI/CD

on:
  push:
    branches: ['main']
    paths:
      - 'packages/backend/**'
      - '.github/**'
  pull_request:
    branches: ['main']
    paths:
      - 'packages/backend/**'
      - '.github/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
          cache: 'npm'

      - name: Build
        run: |
          npm ci
          npm --workspace=@savee/backend run build
      - name: Copy files
        run: |
          mkdir -p artifacts/
          cp -r packages/backend/build/ artifacts/
          cp packages/backend/package.json artifacts/build/
          cp packages/backend/ecosystem.config.js artifacts/build/
          cp package-lock.json artifacts/build/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: artifacts/build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v1.3.1
        with:
          # Export loaded secrets as environment variables
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_KEY: 'op://Savee/Hetzner/private Key'
          HOST: 'op://Savee/Server/Host'
          USER: 'op://Savee/Server/User'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: artifacts/build
      - name: Install production dependencies
        run: |
          cd artifacts/build
          npm install --include=prod
      - name: Show content of artifacts
        run: |
          ls artifacts/build
      - name: Setup SSH
        run: |
          set -eu
          mkdir $HOME/.ssh
          echo "$SSH_KEY" > $HOME/.ssh/ssh-rsa
          chmod 600 $HOME/.ssh/ssh-rsa
          ssh-keyscan -t rsa $HOST > $HOME/.ssh/known_hosts
          chmod 600 $HOME/.ssh/known_hosts
          echo -e "Host $HOST\n\tHostName $HOST\n\tUser $USER\n\tIdentityFile $HOME/.ssh/ssh-rsa" > $HOME/.ssh/config
          chmod 600 $HOME/.ssh/config
      - name: Deploy new code
        run: |
          rsync --archive --compress --delete artifacts/build/* $USER@$HOST:/srv/savee/api
      - name: Start the app
        run: |
          ssh $USER@$HOST '
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            cd /srv/savee/api &&
            pm2 start ecosystem.config.js
          '
