# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '16.20.2'
        cache: 'npm'

    - name: Build
      run: |
        npm ci
        npm --workspace=@savee/backend run build
    - name: Copy files
      run: |
        mkdir artifacts/build
        cp -r packages/backend/build/ artifacts/build/
        cp packages/backend/package.json artifacts/build/
        cp packages/backend/package-lock.json artifacts/build/

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: artifacts/build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: build
        path: artifacts/build
    - name: Show content of artifacts
      run: ls artifacts
