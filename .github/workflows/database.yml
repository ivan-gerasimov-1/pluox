# TODO: Find a way to parametrize "runs-on"
name: MongoDB CI/CD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/setup-node@v4

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_KEY: 'op://Savee/GitHub Actions/private key'
          HOST: 'op://Savee/Main Server/Host'
          USER: 'op://Savee/Main Server/Username'

      - name: Setup SSH
        run: |
          set -eu

          mkdir $HOME/.ssh

          echo "$SSH_KEY" \
            > $HOME/.ssh/ssh-rsa
          chmod 600 $HOME/.ssh/ssh-rsa

          ssh-keyscan -t rsa $HOST \
            > $HOME/.ssh/known_hosts
          chmod 600 $HOME/.ssh/known_hosts

          echo -e "
            Host $HOST
              \tHostName $HOST
              \tUser $USER
              \tIdentityFile $HOME/.ssh/ssh-rsa
            " \
            > $HOME/.ssh/config
          chmod 600 $HOME/.ssh/config

      - name: Run
        run: |
          ssh -T $USER@$HOST "
            docker stop mongodb
            docker rm mongodb
            docker run \
              --name mongodb \
              -v ~/developer/lv48/misc/mongodb:/data/db \
              --network dockernetworks_containers-network \
              -p 27017:27017 \
              --detach \
              mongo:7.0.11
          "
