name: Frontend (Cloudflare)

env:
  NODE_VERSION: 24.1.0

  NPM_BUILD_CMD: --workspace=@pluox/frontend run build
  NPM_LINT_CMD: --workspace=@pluox/frontend run lint
  NPM_TEST_CMD: --workspace=@pluox/frontend run test

  ARTIFACTS_DIR: apps/frontend/build
  ARTIFACT_NAME: build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend_cloudflare.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend_cloudflare.yml'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ENV_FILE: 'op://Pluox/pluox_frontend_env/.env.production'

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint
        run: |
          npm $NPM_LINT_CMD

      - name: Test
        run: |
          npm $NPM_TEST_CMD

      - name: Build
        run: |
          echo -e "$ENV_FILE" > apps/frontend/.env
          npm $NPM_BUILD_CMD

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}

  deploy:
    runs-on: ubuntu-22.04
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 'op://LV48/Cloudflare Wrangler/Account ID'
          CLOUDFLARE_API_TOKEN: 'op://LV48/Cloudflare Wrangler/API Token'

      - name: Install dependencies
        run: |
          npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.19.1'
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/frontend'
          command: pages deploy
