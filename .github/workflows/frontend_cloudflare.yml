name: Frontend (Cloudflare)

env:
  NODE_VERSION: 24.14

  NPM_BUILD_CMD: --workspace=@pluox/web run build
  NPM_LINT_CMD: --workspace=@pluox/web --workspace=@pluox/core --workspace=@pluox/kit run lint:ci
  NPM_FORMAT_CMD: --workspace=@pluox/web --workspace=@pluox/core --workspace=@pluox/kit run format:check
  NPM_TEST_CMD: --workspace=@pluox/web run test

  ARTIFACTS_DIR: apps/web/build
  ARTIFACT_NAME: build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/core/**'
      - 'apps/kit/**'
      - '.github/workflows/web_cloudflare.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/core/**'
      - 'apps/kit/**'
      - '.github/workflows/web_cloudflare.yml'

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@dafbe7cb03502b260e2b2893c753c352eee545bf # v3.2.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ENV_FILE: 'op://Pluox/pluox_frontend_env/.env.production'

      - name: Install dependencies
        run: |
          npm ci

      - name: Format
        run: |
          npm $NPM_FORMAT_CMD

      - name: Lint
        run: |
          npm $NPM_LINT_CMD

      # - name: Test
      #   run: |
      #     npm $NPM_TEST_CMD

      - name: Build
        run: |
          echo -e "$ENV_FILE" > apps/web/.env
          npm $NPM_BUILD_CMD

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}

  deploy:
    runs-on: ubuntu-24.04-arm
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@dafbe7cb03502b260e2b2893c753c352eee545bf # v3.2.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 'op://LV48/Cloudflare Wrangler/Account ID'
          CLOUDFLARE_API_TOKEN: 'op://LV48/Cloudflare Wrangler/API Token'

      - name: Install dependencies
        run: |
          npm ci

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.73.0'
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/web'
          command: deploy
