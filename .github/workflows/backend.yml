name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/backend/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/backend/**'

env:
  NODE_VERSION: 16.20.2
  BUILD_ARTIFACTS: artifacts/build
  ARTIFACT_NAME: build

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Build
        run: |
          npm ci
          npm --workspace=@savee/backend run build

      - name: Create artifacts directory
        run: |
          mkdir -p $BUILD_ARTIFACTS

      - name: Copy files
        run: |
          cp -r packages/backend/build/* $BUILD_ARTIFACTS/
          cp \
            package-lock.json \
            packages/backend/package.json \
            packages/backend/ecosystem.config.js \
            $BUILD_ARTIFACTS/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: $ARTIFACT_NAME
          path: $BUILD_ARTIFACTS

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          # Export loaded secrets as environment variables
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_KEY: 'op://Savee/GitHub Actions/private key'
          HOST: 'op://Savee/Savee Server/Host'
          USER: 'op://Savee/Savee Server/User'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: $ARTIFACT_NAME
          path: $BUILD_ARTIFACTS

      - name: Install production dependencies
        run: |
          cd $BUILD_ARTIFACTS
          npm install --include=prod

      - name: Clean up build
        run: |
          cd $BUILD_ARTIFACTS
          rm \
            package.json \
            package-lock.json

      - name: Setup SSH
        run: |
          set -eu
          mkdir $HOME/.ssh
          echo "$SSH_KEY" \
            > $HOME/.ssh/ssh-rsa
          chmod 600 $HOME/.ssh/ssh-rsa
          ssh-keyscan -t rsa $HOST \
            > $HOME/.ssh/known_hosts
          chmod 600 $HOME/.ssh/known_hosts
          echo -e "Host $HOST\n\tHostName $HOST\n\tUser $USER\n\tIdentityFile $HOME/.ssh/ssh-rsa" \
            > $HOME/.ssh/config
          chmod 600 $HOME/.ssh/config

      - name: Deploy
        run: |
          rsync --archive --compress --delete $BUILD_ARTIFACTS/* $USER@$HOST:/srv/savee/api

      - name: Run
        run: |
          ssh $USER@$HOST '
            export NVM_DIR=~/.nvm
            source ~/.nvm/nvm.sh
            cd /srv/savee/api
            pm2 start ecosystem.config.js
          '
