# TODO: Find a way to parametrize "runs-on"
name: DEPRECATED_Backend CI/CD V2

env:
  NODE_VERSION: 24.1.0

  NPM_BUILD_CMD: --workspace=@pluox/backend run build

  # deprecated
  DEPLOY_DESTINATION: ~/srv/pluox/api

  # Docker
  IMAGE_TAG: ghcr.io/${{ github.repository }}/pluox-api:stable
  DOCKER_REGISTRY_USERNAME: ${{ github.actor }}
  DOCKER_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'apps/backend/**'
  #     - '.github/workflows/backend-v2.yml'
  # pull_request:
  #   branches:
  #     - main
  #   paths:
  #     - 'apps/backend/**'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ENV_FILE: 'op://Pluox/pluox-api_backend-lite_env/.env.production'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ env.DOCKER_REGISTRY_USERNAME }}
          password: ${{ env.DOCKER_REGISTRY_PASSWORD }}

      - name: Build
        run: |
          echo -e "$ENV_FILE" > apps/backend/.env
          npm ci
          npm $NPM_BUILD_CMD

      - name: Build Docker image
        run: |
          cd apps/backend
          npm run _docker:copyFiles
          cd dist
          docker buildx build \
            --platform linux/arm64 \
            --tag ${IMAGE_TAG} \
            --load \
            .

      - name: Publish Docker image
        run: |
          docker push ${IMAGE_TAG}

  deploy:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_KEY: 'op://LV48/GitHub Actions/private key'
          HOST: 'op://Pluox/Main Server/Host'
          USER: 'op://Pluox/Main Server/Username'

      - name: Setup SSH
        run: |
          set -eu

          mkdir $HOME/.ssh

          echo "$SSH_KEY" \
            > $HOME/.ssh/ssh-rsa
          chmod 600 $HOME/.ssh/ssh-rsa

          ssh-keyscan -t rsa $HOST \
            > $HOME/.ssh/known_hosts
          chmod 600 $HOME/.ssh/known_hosts

          echo -e "
            Host $HOST
              \tHostName $HOST
              \tUser $USER
              \tIdentityFile $HOME/.ssh/ssh-rsa
            " \
            > $HOME/.ssh/config
          chmod 600 $HOME/.ssh/config

      - name: Deploy docker-compose.yml
        run: |
          ssh -T $USER@$HOST "
            mkdir -p \
              $DEPLOY_DESTINATION
          "
          rsync \
            --archive \
            --compress \
            --delete \
            apps/backend/.docker/docker-compose.yml $USER@$HOST:$DEPLOY_DESTINATION

      - name: Deploy
        run: |
          ssh -T $USER@$HOST "
            echo ${DOCKER_REGISTRY_PASSWORD} | docker login ghcr.io -u "${DOCKER_REGISTRY_USERNAME}" --password-stdin
            docker pull ${IMAGE_TAG}
            cd ${DEPLOY_DESTINATION}
            docker compose up -d
          "
