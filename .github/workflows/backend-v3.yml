name: Backend V3 CI/CD

env:
  NODE_VERSION: 22.9.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/backend-lite/**'
      - '.github/workflows/backend-v3.yml'

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1Password/load-secrets-action@v2.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 'op://Savee/Cloudflare Wrangler/Account ID'
          CLOUDFLARE_API_TOKEN: 'op://Savee/Cloudflare Wrangler/API Token'
          ENV_FILE: 'op://Savee/savee-api-v3_cloudflare_env/.env.production'

      - name: Install dependencies
        run: |
          npm ci

      - name: Create .env file
        run: |
          echo -e "$ENV_FILE" > apps/backend-lite/.env

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/backend-lite'
          command: deploy
