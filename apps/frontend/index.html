<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<meta name="description" content="Organize your expenses with Pluox" />

		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/icon_192.png" />
		<meta name="theme-color" content="#FAFAFA" />

		<link rel="icon" href="/favicon.svg" />

		<title>Pluox</title>

		<style>
			body {
				margin: 0;

				color: #333;
				background-color: #fafafa;
			}

			.loaderContainer {
				position: fixed;

				width: 100%;

				margin-top: 100px;

				display: flex;

				align-items: center;
				justify-content: center;
			}

			.loaderContent {
				width: 10vw;
				aspect-ratio: 1;

				border: 0.5vw solid #333;

				animation: loaderAnimation 2.5s infinite;

				will-change: border-radius;
			}

			@keyframes loaderAnimation {
				0% {
					border-radius: 50% 50% 15% 15%;
				}
				25% {
					border-radius: 15% 50% 50% 15%;
				}
				50% {
					border-radius: 15% 15% 50% 50%;
				}
				75% {
					border-radius: 50% 15% 15% 50%;
				}
				100% {
					border-radius: 50% 50% 15% 15%;
				}
			}

			.skeleton {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				padding-inline: 15px;
				padding-block: 25px;
				transition: opacity 0.15s ease-in-out;
				background-color: #fafafa;
				z-index: 1;
			}

			.skeleton.hidden {
				opacity: 0;

				pointer-events: none;
			}

			.skeletonHeader {
				display: flex;
				justify-content: flex-end;
				height: 35px;
				padding-inline: 2px;
				padding-block: 1px;
			}

			.skeletonBox {
				width: 28px;
				height: 28px;
				background-color: rgb(179, 177, 177);
				border-radius: 100%;
			}

			.skeletonCard {
				width: 100%;
				height: 156px;

				padding: 25px 20px;

				margin-top: 25px;

				border-radius: 17px;

				background-color: white;

				box-shadow: 0 1.5em 2.5em -0.5em rgba(0, 0, 0, 0.125);
				box-shadow: 0 10px 15px -5px #e9e9e9;
			}

			.block {
				width: 75px;
				height: 15px;

				border-radius: 14px;

				background-color: #b5b5b5;
			}

			.block--amount {
				height: 40px;
				width: 150px;
				margin-block-start: 35px;
			}
		</style>
	</head>

	<body>
		<div id="loader" class="skeleton">
			<div class="skeletonHeader">
				<div class="skeletonBox"></div>
			</div>

			<div class="block block--amount"></div>

			<div class="skeletonCard">
				<div class="block"></div>
			</div>

			<div class="loaderContainer">
				<div class="loaderContent"></div>
			</div>
		</div>

		<div id="pluoxRoot"></div>

		<noscript>You need to enable JavaScript to run this app.</noscript>
		<script type="module" src="/src/index.ts"></script>
	</body>
</html>
