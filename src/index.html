<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<meta name="description" content="Save some money with Savee" />

		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/icon_192.png" />
		<meta name="theme-color" content="#FAFAFA" />

		<link rel="icon" href="/favicon.ico" />

		<title>Savee</title>

		<style>
			body {
				margin: 0;

				-webkit-font-smoothing: antialiased;
				-webkit-tap-highlight-color: transparent;

				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica,
					'Apple Color Emoji', Arial, sans-serif, 'Segoe UI Emoji',
					'Segoe UI Symbol';

				color: #333;
				background-color: #fafafa;
			}

			.loading {
				width: 100%;
				height: 100vh;

				display: flex;

				align-items: center;
				justify-content: center;
			}

			.loader {
				width: 80px;
				aspect-ratio: 1;
				border: 10px solid #fff;
				box-sizing: border-box;
				background:
					radial-gradient(farthest-side, #2a2a2a 98%, #0000) top,
					radial-gradient(farthest-side, #2a2a2a 98%, #0000) top,
					radial-gradient(farthest-side, #2a2a2a 98%, #0000) left,
					radial-gradient(farthest-side, #2a2a2a 98%, #0000) right,
					radial-gradient(farthest-side, #2a2a2a 98%, #0000) bottom,
					#fff;
				background-size: 20px 20px;
				background-repeat: no-repeat;
				filter: blur(4px) contrast(10);
				animation: l19 2s infinite;
			}

			@keyframes l19 {
				0% {
					background-position: top, top, left, right, bottom;
				}
				25% {
					background-position: right, top, left, right, bottom;
				}
				50% {
					background-position: bottom, top, left, right, bottom;
				}
				75% {
					background-position: left, top, left, right, bottom;
				}
				100% {
					background-position: top, top, left, right, bottom;
				}
			}
		</style>
	</head>

	<body>
		<div id="root">
			<div class="loading">
				<div class="loader"></div>
			</div>
		</div>

		<noscript>You need to enable JavaScript to run this app.</noscript>
	</body>
</html>
