<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<meta name="description" content="Save some money with Savee" />

		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/icon_192.png" />
		<meta name="theme-color" content="#FAFAFA" />

		<link rel="icon" href="/favicon.ico" />

		<title>Savee</title>

		<style>
			body {
				margin: 0;

				-webkit-font-smoothing: antialiased;
				-webkit-tap-highlight-color: transparent;

				font-family: system-ui, BlinkMacSystemFont, 'Segoe UI', Helvetica,
					'Apple Color Emoji', Arial, sans-serif, 'Segoe UI Emoji',
					'Segoe UI Symbol';

				color: #333;
				background-color: #fafafa;
			}

			.loading {
				position: fixed;

				width: 100%;
				height: 100dvh;

				display: flex;

				align-items: center;
				justify-content: center;

				background-color: #fafafa;

				transition: opacity 0.15s ease-in-out;
				z-index: 1;
			}

			.loading.hidded {
				opacity: 0;
			}

			.loader {
				width: 10vw;
				aspect-ratio: 1;

				border: 0.5vw solid #333;

				animation: loader 2.5s infinite;

				will-change: border-radius;
			}

			@keyframes loader {
				0% {
					border-radius: 50% 50% 15% 15%;
				}
				25% {
					border-radius: 15% 50% 50% 15%;
				}
				50% {
					border-radius: 15% 15% 50% 50%;
				}
				75% {
					border-radius: 50% 15% 15% 50%;
				}
				100% {
					border-radius: 50% 50% 15% 15%;
				}
			}
		</style>
	</head>

	<body>
		<div id="loader" class="loading">
			<div class="loader"></div>
		</div>

		<div id="saveeRoot"></div>

		<noscript>You need to enable JavaScript to run this app.</noscript>
	</body>
</html>
